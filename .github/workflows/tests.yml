name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hermetic:
    name: hermetic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run config + health tests
        run: |
          python -m unittest discover -s tests -p "test_config.py" -v
          python -m unittest discover -s tests -p "test_health.py" -v

  lint:
    name: lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Pyflakes check on enterprise modules
        run: ruff check --select F core config protocol tests
